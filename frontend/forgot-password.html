<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Vikrant University</title>
    <meta name="description" content="Reset your password for Vikrant University Syllabus Portal" />
    <meta name="author" content="Vikrant University" />

    <link rel="icon" type="image/x-icon" href="logo.jpeg" />

    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header-content">
          <div class="logo-section">
            <a href="/" class="logo" style="text-decoration: none;">
              <img src="logo.jpeg" alt="Vikrant University" class="logo-image" />
              <span id="logo-text">Vikrant University</span>
            </a>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <div class="auth-container" style="min-height: 70vh;">
          <div class="auth-card" style="max-width: 450px;">
            <div class="auth-header">
              <h2>Reset Password</h2>
              <p>Enter your email to receive OTP</p>
            </div>

            <!-- Step 1: Email -->
            <div id="forgot-step-1">
              <form id="forgot-email-form" class="auth-form">
                <div class="form-group">
                  <label for="forgot-email">Email Address</label>
                  <div class="password-input-container">
                    <input
                      type="email"
                      id="forgot-email"
                      required
                      placeholder="Enter your registered email"
                    />
                  </div>
                </div>
                <button type="submit" class="btn-primary btn-full" id="send-otp-btn">
                  <i class="fas fa-envelope"></i> Send OTP
                </button>
              </form>
            </div>

            <!-- Step 2: OTP + New Password -->
            <div id="forgot-step-2" style="display: none;">
              <div class="auth-header" style="margin-bottom: 1rem;">
                <p style="color: var(--text-secondary); font-size: 0.9rem;">
                  OTP sent to <strong id="forgot-email-display" style="color: var(--primary-color);"></strong>
                </p>
              </div>
              <form id="forgot-reset-form" class="auth-form">
                <div class="form-group">
                  <label for="forgot-otp">Enter OTP</label>
                  <input
                    type="text"
                    id="forgot-otp"
                    required
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    style="text-align: center; letter-spacing: 8px;"
                  />
                </div>
                <div class="form-group">
                  <label for="forgot-new-password">New Password</label>
                  <div class="password-input-container">
                    <input
                      type="password"
                      id="forgot-new-password"
                      required
                      placeholder="Enter new password (min 6 chars)"
                    />
                    <button
                      type="button"
                      class="password-toggle"
                      onclick="togglePassword('forgot-new-password')"
                    >
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>
                <div class="form-group">
                  <label for="forgot-confirm-password">Confirm Password</label>
                  <div class="password-input-container">
                    <input
                      type="password"
                      id="forgot-confirm-password"
                      required
                      placeholder="Confirm new password"
                    />
                    <button
                      type="button"
                      class="password-toggle"
                      onclick="togglePassword('forgot-confirm-password')"
                    >
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>

                <div id="forgot-timer" style="text-align: center; margin: 0.5rem 0; color: var(--text-secondary); font-size: 0.9rem;">
                  <span id="forgot-timer-text">OTP expires in 5:00</span>
                </div>

                <button type="submit" class="btn-primary btn-full" id="reset-password-btn">
                  <i class="fas fa-check"></i> Reset Password
                </button>
                <button type="button" class="btn-secondary btn-full" id="forgot-resend-btn" style="margin-top: 0.5rem;">
                  <i class="fas fa-redo"></i> Resend OTP
                </button>
                <button type="button" class="btn-secondary btn-full" id="forgot-back-btn" style="margin-top: 0.5rem;">
                  <i class="fas fa-arrow-left"></i> Back to Login
                </button>
              </form>
            </div>

            <div class="auth-footer">
              <p><a href="/admin" style="color: var(--primary-color); text-decoration: none;">← Back to Login</a></p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="toast-container" class="toast-container"></div>
    <div id="loading" class="loading" style="display: none">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/forgot-password.js"></script>
  </body>
</html>
